name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: find . -path ./node_modules -prune -o -name '*.js' -print | xargs -I{} node --check {}
      - name: Unit tests (input validation)
        run: npm test
