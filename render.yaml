# Render Blueprint for the DocMind AI backend.
# Deploy: Render Dashboard -> New -> Blueprint -> select the docmind-ai-backend repo.
# Fill in MONGO_URI (MongoDB Atlas), GEMINI_API_KEY, and FRONTEND_URL when prompted.
services:
  - type: web
    name: docmind-ai-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # paste your Google Gemini API key
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: FRONTEND_URL
        sync: false # e.g. your deployed frontend origin (optional)
